<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7EF9FF" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="magentaGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E040FB" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9D00FF" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cyan orbital arcs (top-left, logo style) -->
  <g filter="url(#softGlow)" opacity="0.55">
    <path d="M180 420 C220 180 480 80 720 160" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M160 450 C210 200 500 90 760 180" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M140 480 C200 220 520 100 800 200" stroke="url(#cyanGrad)" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>
    <path d="M120 510 C190 240 540 110 840 220" stroke="url(#cyanGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <circle cx="720" cy="160" r="5" fill="#00E5FF"/>
    <circle cx="760" cy="180" r="4" fill="#7EF9FF"/>
    <circle cx="800" cy="200" r="3.5" fill="#00E5FF"/>
    <circle cx="840" cy="220" r="3" fill="#7EF9FF"/>
  </g>

  <!-- Magenta orbital arcs (bottom-right, logo style) -->
  <g filter="url(#softGlow)" opacity="0.55">
    <path d="M1020 380 C980 620 720 720 480 640" stroke="url(#magentaGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M1040 350 C990 600 700 710 440 620" stroke="url(#magentaGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M1060 320 C1000 580 680 700 400 600" stroke="url(#magentaGrad)" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>
    <path d="M1080 290 C1010 560 660 690 360 580" stroke="url(#magentaGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <circle cx="480" cy="640" r="5" fill="#E040FB"/>
    <circle cx="440" cy="620" r="4" fill="#FFB7FF"/>
    <circle cx="400" cy="600" r="3.5" fill="#E040FB"/>
    <circle cx="360" cy="580" r="3" fill="#9D00FF"/>
  </g>
</svg>
